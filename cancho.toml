[package]
name = "cancho-oci"
cancho = "25448b8f0d1e899dbfa7663aa0e5a521acd2a3dd"   # the compiler these sources were written for

# One program per capability row (docs/design.md 5.5): a program's authority is
# the union of what its main reaches, so `build` (files, no network) and `push`
# (one registry) are separate binaries and their reports never mix.
# `push` arrives with #9; the ceiling for each binary lives in ceilings/.

[[bin]]
name = "oci-build"
sources = ["src/digest", "src/tar", "src/elf", "src/place", "src/store", "src/image", "src/gzip", "src/layer", "src/build"]
std = true
out = "build/oci-build"

# The test harness for oci.tar (#3): not shipped, but built and held to its own
# authority ceiling like every other program (G5).
[[bin]]
name = "tar-probe"
sources = ["src/tar", "tests/probe/tar"]
std = true
out = "build/tar-probe"

# The test harness for oci.digest and oci.store (#4), held to its own ceiling.
[[bin]]
name = "store-probe"
sources = ["src/digest", "src/store", "tests/probe/store"]
std = true
out = "build/store-probe"

# The test harness for oci.image (#5), held to its own ceiling.
[[bin]]
name = "image-probe"
sources = ["src/digest", "src/store", "src/image", "tests/probe/image"]
std = true
out = "build/image-probe"

# The test harness for oci.gzip (#6), held to its own ceiling.
[[bin]]
name = "gzip-probe"
sources = ["src/gzip", "tests/probe/gzip"]
std = true
out = "build/gzip-probe"

# Combine per-platform images into one multi-platform image (#8).
[[bin]]
name = "oci-index"
sources = ["src/digest", "src/store", "src/image", "src/layout", "src/indexcli"]
std = true
out = "build/oci-index"

# The test harness for oci.http (#9), held to its own ceiling.
[[bin]]
name = "http-probe"
sources = ["src/http", "tests/probe/http"]
std = true
out = "build/http-probe"

# Push an image from a layout to a registry (#9): the only program here with a network row.
[[bin]]
name = "oci-push"
sources = ["src/digest", "src/store", "src/image", "src/layout", "src/http", "src/registry", "src/pushcli"]
std = true
out = "build/oci-push"

# Fetch an image from a registry into a layout (#9).
[[bin]]
name = "oci-pull"
sources = ["src/digest", "src/store", "src/image", "src/layout", "src/http", "src/registry", "src/pullcli"]
std = true
out = "build/oci-pull"

[[test]]
name = "scaffold"
sources = ["tests/scaffold_test.cho"]
std = true

[[test]]
name = "tar"
sources = ["src/tar", "tests/tar_test.cho"]
std = true

[[test]]
name = "digest"
sources = ["src/digest", "tests/digest_test.cho"]
std = true

[[test]]
name = "image"
sources = ["src/digest", "src/image", "tests/image_test.cho"]
std = true

[[test]]
name = "elf"
sources = ["src/elf", "tests/elf_test.cho"]
std = true

[[test]]
name = "layout"
sources = ["src/digest", "src/store", "src/layout", "tests/layout_test.cho"]
std = true
