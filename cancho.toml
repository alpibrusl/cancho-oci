[package]
name = "cancho-oci"
cancho = "25448b8f0d1e899dbfa7663aa0e5a521acd2a3dd"   # the compiler these sources were written for

# One program per capability row (docs/design.md 5.5): a program's authority is
# the union of what its main reaches, so `build` (files, no network) and `push`
# (one registry) are separate binaries and their reports never mix.
# `push` arrives with #9; the ceiling for each binary lives in ceilings/.

[[bin]]
name = "oci-build"
sources = ["src/build"]
std = true
out = "build/oci-build"

# The test harness for oci.tar (#3): not shipped, but built and held to its own
# authority ceiling like every other program (G5).
[[bin]]
name = "tar-probe"
sources = ["src/tar", "tests/probe/tar"]
std = true
out = "build/tar-probe"

# The test harness for oci.digest and oci.store (#4), held to its own ceiling.
[[bin]]
name = "store-probe"
sources = ["src/digest", "src/store", "tests/probe/store"]
std = true
out = "build/store-probe"

[[test]]
name = "scaffold"
sources = ["tests/scaffold_test.cho"]
std = true

[[test]]
name = "tar"
sources = ["src/tar", "tests/tar_test.cho"]
std = true

[[test]]
name = "digest"
sources = ["src/digest", "tests/digest_test.cho"]
std = true
