name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: oci

      # The compiler is whichever commit cancho.toml says these sources were
      # written for: one place, which the compiler itself checks.
      - name: Read the compiler pin from cancho.toml
        id: pin
        run: echo "rev=$(sed -n 's/^cancho *= *"\([0-9a-f]*\)".*/\1/p' oci/cancho.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ steps.pin.outputs.rev }}
          path: cancho

      - name: Cache the compiler
        id: compiler
        uses: actions/cache@v4
        with:
          path: cancho/target/release/cancho
          key: cancho-${{ steps.pin.outputs.rev }}

      - name: Build cancho
        if: steps.compiler.outputs.cache-hit != 'true'
        working-directory: cancho
        run: cargo build --release -p cancho

      - name: Put the compiler on PATH
        run: echo "$GITHUB_WORKSPACE/cancho/target/release" >> "$GITHUB_PATH"

      - name: The compiler is the one cancho.toml pins
        working-directory: oci
        run: cancho --version | grep -F "rev ${{ steps.pin.outputs.rev }}"

      - name: Formatting
        working-directory: oci
        run: cancho fmt --check src tests

      - name: Build every program
        working-directory: oci
        run: cancho build

      - name: Tests
        working-directory: oci
        run: cancho test

      - name: G1 (layers) -- oci.tar is byte-identical to Python's tarfile on random archives, and refuses what it must
        working-directory: oci
        run: |
          for seed in 1 2 3; do python3 scripts/tar_diff.py --cases 300 --seed $seed; done

      - name: G1 (layers) -- the writer's mutants are all killed
        working-directory: oci
        run: python3 scripts/tar_mutants.py --cases 100

      - name: Tools the store gate compares against
        run: sudo apt-get install -y -q strace coreutils

      - name: Digests agree with sha256sum (incl. a 4.5 GiB file past the 32-bit counter); the store is write-once, tamper-evident and confined
        working-directory: oci
        run: python3 scripts/store_diff.py --big-gib 4.5

      - name: The store's mutants are all killed
        working-directory: oci
        run: python3 scripts/store_mutants.py

      - name: Durability, observed -- fsync, a rename that cannot replace, fsync (Linux)
        working-directory: oci
        run: python3 scripts/store_syscalls.py

      - name: Tools the image gate validates with (OCI JSON schemas via jsonschema, skopeo, crane pinned)
        run: |
          # the runner ships jsonschema 4.10, which has no `registry=`; pin versions that do
          pip install --user --upgrade 'jsonschema==4.23.0' 'referencing==0.35.1'
          python3 -c 'import jsonschema, importlib.metadata as m; print("jsonschema", m.version("jsonschema"))'
          sudo apt-get install -y -q skopeo
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: The image layout validates against the OCI schemas, matches an independent model byte for byte, is reproducible, and skopeo and crane accept it
        working-directory: oci
        run: |
          skopeo --version && crane version
          python3 scripts/image_check.py --cases 80 --seed 1
          python3 scripts/image_check.py --cases 80 --seed 2

      - name: gzip -- four independent decoders, every edge, the same bytes however the data is offered, stored blocks for the incompressible
        working-directory: oci
        run: python3 scripts/gzip_check.py --big-mib 8

      - name: The gzip encoder's mutants are all killed
        working-directory: oci
        run: python3 scripts/gzip_mutants.py

      - name: The image module's mutants are all killed
        working-directory: oci
        run: python3 scripts/image_mutants.py

      - name: oci-build -- layers equal the tarfile oracle, images validate and reproduce, ELF and path refusals, an image runs in a container
        working-directory: oci
        run: |
          python3 scripts/build_check.py --cases 30 --seed 1 --run --crane
          python3 scripts/build_check.py --cases 30 --seed 2

      - name: oci-index -- a multi-platform image checked against the schemas and an independent byte-level model, skopeo picks each architecture, crane validates every image under the index
        working-directory: oci
        run: |
          python3 scripts/index_check.py --cases 16 --seed 1
          python3 scripts/index_check.py --cases 16 --seed 2

      - name: oci-index's mutants are all killed
        working-directory: oci
        run: python3 scripts/index_mutants.py

      - name: oci-push and oci-pull -- a mock registry with every fault, then crane registry serve and registry:2 as real registries
        working-directory: oci
        run: python3 scripts/registry_check.py

      - name: oci-push and oci-pull's mutants are all killed
        working-directory: oci
        run: python3 scripts/registry_mutants.py --jobs 4

      - name: oci-sign -- Ed25519 signatures equal OpenSSL's byte for byte, every tampering is refused
        working-directory: oci
        run: python3 scripts/sign_check.py

      - name: oci-sign's mutants are all killed
        working-directory: oci
        run: python3 scripts/sign_mutants.py --jobs 4

      - name: oci-sbom -- a CycloneDX 1.5 document that validates against the official schema and equals an independent model byte for byte
        working-directory: oci
        run: python3 scripts/sbom_check.py

      - name: oci-sbom's mutants are all killed
        working-directory: oci
        run: python3 scripts/sbom_mutants.py --jobs 4

      - name: oci-ref -- signatures and SBOMs attached to an image, listed and fetched, with and without the referrers API
        working-directory: oci
        run: python3 scripts/ref_check.py

      - name: oci-ref's mutants are all killed
        working-directory: oci
        run: python3 scripts/ref_mutants.py --jobs 4

      - name: G1 across machines -- every digest equals the committed golden file (also checked on macOS/arm64 in the other job)
        working-directory: oci
        run: python3 scripts/golden_check.py

      - name: oci-build packages itself -- a static build runs in a scratch container (docker)
        working-directory: oci
        run: |
          sh scripts/static_build.sh
          python3 scripts/build_check.py --cases 3 --dogfood build/oci-build-static

      - name: oci-build's mutants are all killed
        working-directory: oci
        run: python3 scripts/build_mutants.py

      - name: G5 -- every binary's authority is within its committed ceiling
        working-directory: oci
        run: python3 scripts/authority_ceiling.py

      - name: G5 -- and the gate can fail (a program that reads a file is refused)
        working-directory: oci
        run: python3 scripts/authority_ceiling.py --selftest

  # The same golden digests on a second operating system and CPU architecture: a build on macOS/arm64 and a build on
  # Linux/x86-64 must give identical manifests, configs, layers and diff_ids (design 2, G1; task #11).
  golden-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          path: oci

      - name: Read the compiler pin from cancho.toml
        id: pin
        run: echo "rev=$(sed -n 's/^cancho *= *"\([0-9a-f]*\)".*/\1/p' oci/cancho.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ steps.pin.outputs.rev }}
          path: cancho

      - name: Cache the compiler
        id: compiler
        uses: actions/cache@v4
        with:
          path: cancho/target/release/cancho
          key: cancho-macos-${{ steps.pin.outputs.rev }}

      - name: Build cancho
        if: steps.compiler.outputs.cache-hit != 'true'
        working-directory: cancho
        run: cargo build --release -p cancho

      - name: Put the compiler on PATH
        run: echo "$GITHUB_WORKSPACE/cancho/target/release" >> "$GITHUB_PATH"

      - name: Build oci-build
        working-directory: oci
        run: |
          cancho --version
          cancho build --bin oci-build

      - name: Every digest equals the golden file, on macOS
        working-directory: oci
        run: python3 scripts/golden_check.py

